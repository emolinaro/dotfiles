# Keep the same prefix and pane split keys as Herdr.
set -g prefix C-b
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Navigate panes with the same prefix+h/j/k/l bindings as Herdr and WezTerm.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Rosé Pine Moon status bar.
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#232136,fg=#908caa'
set -g status-left ""
set -g status-right-length 80
set -g status-right '#[fg=#908caa]%Y-%m-%d %H:%M #[fg=#6e6a86]← #[fg=#9ccfd8]󰉋 #{b:pane_current_path}'
set -g window-status-separator ""
set -g window-status-format ' #I: #W '
set -g window-status-style 'bg=#232136,fg=#6e6a86'
set -g window-status-current-format ' #I: #W '
set -g window-status-current-style 'bg=#f6c177,fg=#232136,bold'
set -g pane-active-border-style 'fg=#f6c177'